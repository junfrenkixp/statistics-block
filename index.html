<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Statistics block</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="statistics-wrap">
    <div class="statistics-block statistics-block--subs">
      <h2 class="statistics-block__header">
        Подписчики
      </h2>
      <div class="statistics-block__results">12K</div>
      <div class="statistics-block__footer">
        <span class="statistics-block__info">За 30 дней</span>
        <span class="statistics-block__results-percent">+12%</span>
      </div>
    </div>
    <div class="statistics-block statistics-block--view">
      <h2 class="statistics-block__header">
        Просмотры
      </h2>
      <div class="statistics-block__results">87K</div>
      <div class="statistics-block__footer">
        <span class="statistics-block__info">За неделю</span>
        <span class="statistics-block__results-percent">+4%</span>
      </div>
    </div>
    <div class="statistics-block statistics-block--sales">
      <h2 class="statistics-block__header">
        Продажи
      </h2>
      <div class="statistics-block__results">324</div>
      <div class="statistics-block__footer">
        <span class="statistics-block__info">За месяц</span>
        <span class="statistics-block__results-percent">+18%</span>
      </div>
    </div>
  </div>
</body>
</html>
